name: Publish trading review
on:
  push:
    branches: [main]
    paths: [payload.json, .github/workflows/deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static files
        run: |
          python3 - <<'PY'
          import json,base64,pathlib
          files=json.loads(pathlib.Path('payload.json').read_text())
          root=pathlib.Path('web');root.mkdir(exist_ok=True)
          for name,content in files.items():
            dest=root/name
            assert dest.resolve().is_relative_to(root.resolve())
            dest.parent.mkdir(parents=True,exist_ok=True)
            dest.write_bytes(base64.b64decode(content))
          PY
      - name: Select Actions as Pages source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          url='https://api.github.com/repos/'+os.environ['GH_REPO']+'/pages'
          req=urllib.request.Request(url,data=json.dumps({'build_type':'workflow'}).encode(),method='PUT',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response:
            result=json.load(response)
            print('Pages build source:',result.get('build_type'))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

